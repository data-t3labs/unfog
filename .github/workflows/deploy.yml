name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Fog of World via Dropbox (src/sync/dropbox.ts): the Dropbox app key is a repository
      # variable (Settings → Secrets and variables → Actions → Variables → VITE_DROPBOX_APP_KEY).
      # Unset ⇒ the app builds fine and Data → Sources shows "Not set up yet" with the steps.
      - run: npm run build
        env:
          VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
      # Routing graph packs (coverage v2 hosting): release assets have no CORS headers, so the packs
      # live on the sibling Pages sites unfog-graph-N (same origin as the app; Range → 206) per
      # tools/build-graph/pages-shards.json. This step writes dist/graph/packs/packs-index.json with
      # the shard URLs (and mirrors the cells of pages-mirror.json, normally none); the second step
      # HEADs every shard URL and fails the deploy if a pack is missing or its size differs from the
      # index (a shard that has not deployed yet → 404: run its mirror.yml first). Nothing is stored
      # in git. docs/coverage-runbook.md § Hosting
      - run: node tools/build-graph/mirror-packs.mjs --out dist/graph/packs
      - run: node tools/build-graph/mirror-packs.mjs --check --out dist/graph/packs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
